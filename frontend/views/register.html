<div class="container page"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">Register</h3>
    <form>
      <div class="mb-3"><label class="form-label" for="regName">Full name</label><input class="form-control" id="regName" required></div>
      <div class="mb-3"><label class="form-label" for="regEmail">Email</label><input class="form-control" id="regEmail" type="email" required></div>
      <div class="mb-3"><label class="form-label" for="regPassword">Password</label><input class="form-control" id="regPassword" type="password" minlength="8" required></div>
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
    <p class="small mt-3 mb-0">Already registered? <a href="#/login">Log in</a></p>
  </div></div>
</div></div></div>
