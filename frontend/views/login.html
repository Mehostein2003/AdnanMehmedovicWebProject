<div class="container page"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">Log in</h3>
    <form>
      <div class="mb-3"><label class="form-label" for="loginEmail">Email</label><input class="form-control" id="loginEmail" type="email" required></div>
      <div class="mb-3"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" type="password" required></div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="small mt-3 mb-0">No account? <a href="#/register">Register</a></p>
  </div></div>
</div></div></div>
